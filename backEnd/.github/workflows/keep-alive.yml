name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes (cron syntax)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to manually run it

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          echo "Pinging backend at $(date)"
          curl -f https://fork-uofc-healthcare-assistant-backend.onrender.com/api/health || echo "Ping failed"
          echo "Ping complete"